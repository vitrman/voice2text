name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Синтаксис
        run: python -m compileall -q app.py asr_engine.py recorder.py config.py paths.py postprocess.py clipboard.py hotkeys.py hotkey_capture.py model_fetch.py update.py cli.py installer tools
      - name: Проверки без модели
        run: python tools/ci_check.py
